# Config file for Zimbra Opensource Edition backup script
# Lines starting with # will be ignored
# Quote values that contain spaces, for example INCREMENTAL_BACKUP_TIMES="06:00 18:00"

# Extra command paths for service/non-login execution.
# Needed for Zimbra bundled commands such as ldapsearch on some installs.
EXTRA_COMMAND_PATHS="/opt/zimbra/bin:/opt/zimbra/common/bin:/opt/zimbra/openldap/bin:/opt/zimbra/postfix/sbin"

# Working directory where backups will be created. 
# Directory must be accessed only by the user running zmbkpose
WORKDIR=

# Must be filled with User Global Administrator's e-mail, possibly admin@example.com
## THIS USER WILL BE USED TO LOGIN VIA HTTP, AND GET A MAILBOX BACKUP
# TIP: If Administrator account is unknown or nonexistent, one must be created through Zimbra server's command line
#	# zmprov ca admin@example.com "password"
#	# zmprov ma admin@example.com zimbraIsAdminAccount TRUE
ADMINUSER=

# Must be filled with the User Global Administrator's password defined in ADMINUSER
ADMINPASS=

# Must be filled with URL of LDAP MASTER
## THIS USER WILL BE USED TO LOGIN VIA LDAP, AND GET ENTRIES BACKUP
## NOTE: No use ldaps, only ldap(port 389) is supported
# example: LDAPMASTERSERVER=ldap://192.168.1.1:389
LDAPMASTERSERVER=

# Must be filled with zimbra_ldap_userdn key value
# TIP: To get this value, execute on Zimbra Server
#	# zmlocalconfig zimbra_ldap_userdn
LDAPZIMBRADN=

# Must be filled with zimbra_ldap_password key value
# TIP: To get this value, execute on Zimbra Server
#       # zmlocalconfig -s zimbra_ldap_password
LDAPZIMBRAPASS=

# Support to parallel accounts backup
#PARALLEL_SUPPORT : 0=Off , 1=On
PARALLEL_SUPPORT=0

# Max simultaneous processes - if PARALLEL_SUPPORT=1
# 2 - 5
MAX_PARALLEL_PROCESS=3

# Verify the generated backup archive before updating the LAST link
# yes/no
VERIFY_BACKUP_AFTER_CREATE=yes

# Mailbox export retry settings
MAILBOX_EXPORT_RETRY_COUNT=4
MAILBOX_EXPORT_RETRY_WAIT_SECONDS=3

# Keep this many full backup cycles per account after a new full backup.
# 0 deletes all existing backup cycles before creating the next full backup.
BACKUP_KEEP_FULL=0

# Colored terminal status output
# auto/always/never
COLOR_MODE=always

# init.d scheduler service settings
SERVICE_USER=zimbra
SCHEDULER_ENABLED=yes
FULL_BACKUP_TIME=00:00
INCREMENTAL_BACKUP_TIMES="06:00 09:00 18:00 21:00"
FULL_BACKUP_ARGS="-f"
INCREMENTAL_BACKUP_ARGS="-i -t"
BACKUP_RETRY_COUNT=3
BACKUP_RETRY_WAIT_SECONDS=300
SCHEDULER_SLEEP_SECONDS=30
SCHEDULER_STATE_DIR=/var/lib/zmbkpose
SCHEDULER_PID_FILE=/var/run/zmbkpose/zmbkposev3-main.pid
MAIN_LOG_FILE=/var/log/zmbkpose/zmbkpose-main.log
CHECK_ZIMBRA_ON_SERVICE_START=yes
ZIMBRA_CONTROL=/opt/zimbra/bin/zmcontrol

# Optional remote copy after scheduled backups.
# Set REMOTE_COPY_ENABLED=yes and choose REMOTE_COPY_METHOD=rsync or sftp.
REMOTE_COPY_ENABLED=no
REMOTE_COPY_METHOD=rsync

# Rsync copy settings
# Sample:
#   REMOTE_COPY_ENABLED=yes
#   REMOTE_COPY_METHOD=rsync
#   RSYNC_TARGET=backupuser@192.0.2.10:/backup/mailbackup-files/
#   RSYNC_SSH_PORT=22
RSYNC_ENABLED=no
RSYNC_TARGET=
RSYNC_OPTIONS="-a --partial --delay-updates"
RSYNC_DELETE=no
RSYNC_BWLIMIT=
RSYNC_SSH_PORT=

# SFTP copy settings. Username is in SFTP_TARGET.
# Passwords are not saved here. The installer can generate this SSH key.
# Copy SFTP_IDENTITY_FILE.pub into the TrueNAS/FreeNAS user's Authorized Keys.
# Sample:
#   REMOTE_COPY_ENABLED=yes
#   REMOTE_COPY_METHOD=sftp
#   SFTP_TARGET=backupuser@192.0.2.10:/backup/mailbackup-files/
#   SFTP_PORT=22
#   SFTP_IDENTITY_FILE=/opt/zimbra/.ssh/zmbkposev3_sftp
SFTP_TARGET=
SFTP_PORT=22
SFTP_IDENTITY_FILE=
SFTP_OPTIONS="-oBatchMode=yes -oStrictHostKeyChecking=accept-new"
